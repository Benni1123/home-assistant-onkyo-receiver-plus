name: Test and package Home Assistant integration
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - name: Build installable ZIPs
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            python scripts/build_release.py --tag "$REF_NAME"
          else
            python scripts/build_release.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: onkyo-receiver-plus-ha
          path: dist/
          if-no-files-found: error
          retention-days: 21

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: onkyo-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: onkyo-receiver-plus-ha
          path: dist/
      - name: Verify packages and create a release draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS.txt)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" dist/onkyo_receiver_plus-ha.zip \
            dist/onkyo_receiver_plus.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes \
            --title "Onkyo Receiver Plus $TAG"
